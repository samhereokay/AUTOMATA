version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: automata-postgres
    environment:
      POSTGRES_USER: automata
      POSTGRES_PASSWORD: automata_password
      POSTGRES_DB: automata
    ports:
      - "5434:5432"
    volumes:
      - automata_pg_data:/var/lib/postgresql/data
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:v1.7.4
    container_name: automata-qdrant
    ports:
      - "6333:6333"
    volumes:
      - automata_qdrant_data:/qdrant/storage
    restart: unless-stopped

  automation-os:
    build: .
    container_name: automata-os
    network_mode: "host"
    environment:
      - NODE_ENV=production
      - N8N_CUSTOM_EXTENSIONS=/home/node/.n8n/custom
      - N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS=false
      - N8N_DIAGNOSTICS_ENABLED=false
      - N8N_BLOCK_ENV_ACCESS_IN_NODE=false
      - EXECUTIONS_DATA_SAVE_ON_ERROR=all
      - EXECUTIONS_DATA_SAVE_ON_SUCCESS=all
      - EXECUTIONS_DATA_SAVE_ON_PROGRESS=true
      - EXECUTIONS_DATA_SAVE_MANUAL_EXECUTIONS=true
      - PORT=3000
      - DATABASE_URL=postgres://automata:automata_password@127.0.0.1:5434/automata
      - OLLAMA_BASE_URL=http://127.0.0.1:11434
      - OLLAMA_MODEL=${OLLAMA_MODEL:-qwen2.5:3b}
      - N8N_URL=http://127.0.0.1:5678
      - N8N_API_KEY=${N8N_API_KEY:-}
      - OLLAMA_EMBEDDING_MODEL=${OLLAMA_EMBEDDING_MODEL:-nomic-embed-text}
      - API_AUTH_TOKEN=${API_AUTH_TOKEN:-default_dev_token_please_change}
      - CORS_ORIGIN=${CORS_ORIGIN:-http://localhost:3000}
      - PIPELINE_INTERVAL_MS=${PIPELINE_INTERVAL_MS:-0}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID}
    depends_on:
      - postgres
    restart: unless-stopped

  n8n:
    build:
      context: .
      dockerfile: Dockerfile.n8n
    container_name: automata-n8n
    environment:
      - DB_TYPE=postgresdb
      - DB_POSTGRESDB_HOST=localhost
      - DB_POSTGRESDB_PORT=5434
      - DB_POSTGRESDB_DATABASE=automata
      - DB_POSTGRESDB_USER=automata
      - DB_POSTGRESDB_PASSWORD=automata_password
      - N8N_BASIC_AUTH_ACTIVE=true
      - N8N_BASIC_AUTH_USER=admin
      - N8N_BASIC_AUTH_PASSWORD=admin
      - N8N_HOST=localhost
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - NODE_ENV=production
      - N8N_CUSTOM_EXTENSIONS=/home/node/.n8n/custom
      - N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS=false
      - N8N_DIAGNOSTICS_ENABLED=false
      - N8N_BLOCK_ENV_ACCESS_IN_NODE=false
      - EXECUTIONS_DATA_SAVE_ON_ERROR=all
      - EXECUTIONS_DATA_SAVE_ON_SUCCESS=all
      - EXECUTIONS_DATA_SAVE_ON_PROGRESS=true
      - EXECUTIONS_DATA_SAVE_MANUAL_EXECUTIONS=true
      - WEBHOOK_URL=http://127.0.0.1:5678/
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID}
    network_mode: "host"
    depends_on:
      - postgres
    volumes:
      - automata_n8n_data:/home/node/.n8n
    restart: unless-stopped

volumes:
  automata_pg_data:
  automata_qdrant_data:
  automata_n8n_data:
